<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Lover｜成人 AI 陪聊</title>
<style>
:root{--pink:#f052a0;--pink2:#ff7bc0;--bg:#08090c;--panel:#14151a;--muted:#9b9ba8;--line:#292a32}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#24101f 0,#08090c 45%);color:#f7f3f7;font:15px system-ui,-apple-system,"Noto Sans TC",sans-serif}
button,input{font:inherit}button{cursor:pointer;border:0;color:white}.hidden{display:none!important}
.wrap{max-width:1100px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.brand{font-size:24px;font-weight:800;color:#ff7bc0}.brand small{display:block;font-size:12px;color:#aaa;font-weight:400}
.btn{border-radius:14px;padding:11px 16px;background:linear-gradient(100deg,#c93683,#f45da8);font-weight:700;box-shadow:0 4px 20px #f052a044}.ghost{background:#1b1c22;border:1px solid #34343d}.card{background:linear-gradient(145deg,#18191f,#101115);border:1px solid var(--line);border-radius:20px;padding:16px}
.age{max-width:440px;margin:12vh auto;text-align:center;padding:30px}.shield{font-size:56px;color:var(--pink)}h1,h2,h3{margin:8px 0 12px}.muted{color:var(--muted)}input{width:100%;background:#0d0e12;border:1px solid #34343d;color:white;border-radius:12px;padding:12px;margin:7px 0}
.layout{display:grid;grid-template-columns:280px 1fr;gap:16px}.side h3{margin:2px 0 16px}.char{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;cursor:pointer;border:1px solid transparent;margin-bottom:8px}.char.active,.char:hover{background:#291622;border-color:#743452}.avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#63264b,#f27bb5);font-size:21px;flex-shrink:0}.tag{font-size:12px;color:#b8b8c2}
.chatbox{min-height:72vh;display:flex;flex-direction:column;padding:0;overflow:hidden}.chathead{padding:16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}.chathead .muted{font-size:12px}.messages{padding:20px;flex:1;overflow:auto;display:flex;flex-direction:column;gap:12px;min-height:360px}.bubble{max-width:78%;padding:12px 15px;border-radius:16px;line-height:1.55;white-space:pre-wrap}.assistant{background:#24252c;align-self:flex-start;border-bottom-left-radius:5px}.user{background:linear-gradient(120deg,#a82e6c,#e84c9a);align-self:flex-end;border-bottom-right-radius:5px}.composer{padding:14px;border-top:1px solid var(--line);display:flex;gap:10px}.composer input{margin:0}.composer button{min-width:50px;border-radius:13px}
.notice{font-size:12px;color:#888;text-align:center;margin:14px 0}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tab{padding:8px 14px;border-radius:99px;background:#1a1b21;color:#aaa}.tab.active{background:#51213c;color:#ff9bcc}
@media(max-width:720px){.wrap{padding:12px}.layout{grid-template-columns:1fr}.side{padding:12px}.roster{display:flex;overflow:auto;gap:5px}.char{min-width:150px}.chatbox{min-height:68vh}.messages{min-height:300px}.top{gap:10px}.brand{font-size:20px}}
</style></head>
<body><main class="wrap">
<header class="top"><div class="brand">AI Lover ♡<small>專屬你的成人 AI 聊天體驗</small></div><div id="userbar" class="muted"></div></header>
<section id="agegate" class="card age"><div class="shield">18+</div><h1>年齡確認</h1><p class="muted">本服務包含成人聊天內容。請確認您已年滿18歲，並遵守所在地法律。</p><label><input id="adult" type="checkbox" style="width:auto"> 我已年滿18歲</label><input id="username" placeholder="帳號（至少3字元）"><input id="password" type="password" placeholder="密碼（至少8字元）"><div style="display:flex;gap:10px;margin-top:8px"><button class="btn" id="register" style="flex:1">註冊</button><button class="btn ghost" id="login" style="flex:1">登入</button></div><p id="authmsg" class="muted"></p></section>
<section id="app" class="hidden"><div class="tabs"><button class="tab active">角色聊天</button><button class="tab" id="logout">登出</button></div><div class="layout">
<aside class="card side"><h3>選擇你的角色</h3><p class="muted">點選角色，開始一段專屬對話。</p><div id="roster" class="roster"></div><div class="notice">角色均為虛構 AI。聊天記錄儲存在此伺服器。</div></aside>
<section class="card chatbox"><div class="chathead"><div class="avatar" id="headavatar">娜</div><div><b id="charname">娜娜</b><div class="muted" id="charinfo">27歲 · 溫柔知性 · AI在線</div></div></div><div id="messages" class="messages"></div><form id="composer" class="composer"><input id="message" maxlength="2000" placeholder="輸入訊息，開始聊天…" autocomplete="off"><button class="btn" type="submit">➤</button></form></section>
</div><p class="notice">請勿輸入密碼、金融資料或其他敏感個資。聊天內容不代表真人意見。</p></section>
</main><script>
const $=id=>document.getElementById(id);let token=localStorage.getItem("ailover_token"),characters=[],current=null;
async function api(path,opts={}){let r=await fetch("/api"+path,{...opts,headers:{"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{}),...(opts.headers||{})}});let d=await r.json();if(!r.ok)throw Error(d.error||"請求失敗");return d}
function showApp(){ $("agegate").classList.add("hidden");$("app").classList.remove("hidden");$("userbar").textContent="已登入";loadCharacters()}
function auth(action){return async()=>{try{if(!$("adult").checked)throw Error("請勾選已年滿18歲");let d=await api("/auth/"+action,{method:"POST",body:JSON.stringify({username:$("username").value.trim(),password:$("password").value,adultConfirmed:true})});token=d.token;localStorage.setItem("ailover_token",token);showApp()}catch(e){$("authmsg").textContent=e.message}}}
$("register").onclick=auth("register");$("login").onclick=auth("login");
$("logout").onclick=()=>{token=null;localStorage.removeItem("ailover_token");$("app").classList.add("hidden");$("agegate").classList.remove("hidden");$("userbar").textContent=""};
async function loadCharacters(){try{characters=await api("/characters");$("roster").innerHTML=characters.map(c=>`<div class="char" data-id="${c.id}"><div class="avatar">${c.name[0]}</div><div><b>${c.name}</b><div class="tag">${c.age}歲 · ${c.tag}</div></div></div>`).join("");$("roster").querySelectorAll(".char").forEach(el=>el.onclick=()=>select(el.dataset.id));select(current||characters[0]?.id)}catch(e){alert(e.message)}}
async function select(id){current=id;let c=characters.find(x=>x.id===id);if(!c)return;$("roster").querySelectorAll(".char").forEach(el=>el.classList.toggle("active",el.dataset.id===id));$("headavatar").textContent=c.name[0];$("charname").textContent=c.name;$("charinfo").textContent=`${c.age}歲 · ${c.tag} · AI在線`;try{let msgs=await api("/chats/"+id);render(msgs.length?msgs:[{role:"assistant",content:c.greeting}])}catch(e){render([{role:"assistant",content:c.greeting}])}}
function render(msgs){let box=$("messages");box.innerHTML=msgs.map(m=>`<div class="bubble ${m.role==="user"?"user":"assistant"}"></div>`).join("");[...box.children].forEach((el,i)=>el.textContent=msgs[i].content);box.scrollTop=box.scrollHeight}
$("composer").onsubmit=async e=>{e.preventDefault();let text=$("message").value.trim();if(!text||!current)return;$("message").value="";let existing=[...$("messages").children].map(el=>({role:el.classList.contains("user")?"user":"assistant",content:el.textContent}));render([...existing,{role:"user",content:text},{role:"assistant",content:"正在回覆…"}]);try{let d=await api("/chat/"+current,{method:"POST",body:JSON.stringify({message:text})});render(d.messages)}catch(err){render([...existing,{role:"user",content:text},{role:"assistant",content:err.message}])}};
if(token)showApp();
</script></body></html>
